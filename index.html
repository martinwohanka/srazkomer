<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Srážkoměr</title>
<meta name="description" content="Předpověď srážek, teploty a větru na 24 h, 48 h a 14 dní pro libovolné místo.">
<meta name="theme-color" content="#070b14">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1.0">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1.0">
<link rel="apple-touch-icon" href="icon-180.png?v=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Srážkoměr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<script>
/* převod nastavení z verzí 1.x, které ukládaly prostý text místo JSON */
['theme','mode','metric','mapov'].forEach(function(k){try{var v=localStorage.getItem('srk.'+k);if(v!=null){try{JSON.parse(v)}catch(e){localStorage.setItem('srk.'+k,JSON.stringify(v))}}}catch(e){}});
(function(){var t=null;try{t=JSON.parse(localStorage.getItem('srk.theme'))}catch(e){}
if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.setAttribute('data-theme',t);
var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#e9f1fb':'#070b14');})();
</script>
<style>
@property --atm1{syntax:'<color>';inherits:true;initial-value:rgba(42,111,214,.34)}
@property --atm2{syntax:'<color>';inherits:true;initial-value:rgba(31,167,201,.22)}
@property --atm3{syntax:'<color>';inherits:true;initial-value:rgba(40,80,160,.28)}
@property --bg1{syntax:'<color>';inherits:true;initial-value:#070b14}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#0a1120}
@property --bg3{syntax:'<color>';inherits:true;initial-value:#0b1424}
:root{
  --bg1:#070b14;--bg2:#0a1120;--bg3:#0b1424;
  --text:#e8eefb;--muted:#9fb4d4;--accent:#8db8ff;
  --g1:rgba(22,32,56,.58);--g2:rgba(10,16,30,.46);--gb:rgba(255,255,255,.11);
  --shadow:0 12px 32px rgba(0,0,0,.34);
  --chip:rgba(255,255,255,.07);--chipb:rgba(255,255,255,.09);
  --input:rgba(8,14,26,.45);--halo:#0b1424;
  --nowg1:rgba(61,141,224,.20);--nowg2:rgba(70,200,232,.06);
  --pop:rgba(16,24,40,.985);
  --c1:#46c8e8;--c2:#7aa7ff;--c3:#f0a35e;--c4:#c49bff;--hshadow:0 1px 10px rgba(7,11,20,.85);
  --fh:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg1:#e9f1fb;--bg2:#dbe8f7;--bg3:#ccdef1;
  --text:#172234;--muted:#4f617c;--accent:#2f6fe0;
  --g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.36);--gb:rgba(255,255,255,.75);
  --shadow:0 10px 28px rgba(40,70,120,.13);
  --chip:rgba(255,255,255,.55);--chipb:rgba(23,34,52,.08);
  --input:rgba(255,255,255,.6);--halo:#e4eef9;
  --nowg1:rgba(61,141,224,.16);--nowg2:rgba(70,200,232,.05);
  --pop:rgba(250,252,255,.99);
  --c1:#0b87a8;--c2:#3563c9;--c3:#b9621a;--c4:#7d4fcf;--hshadow:0 1px 10px rgba(233,241,251,.95);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg1);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font:400 15px/1.45 var(--fb);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
.atmo{position:fixed;left:0;top:0;width:100%;height:100lvh;z-index:0;pointer-events:none;
  background:
   radial-gradient(70% 48% at 12% 0%,var(--atm1),transparent 72%),
   radial-gradient(60% 42% at 92% 12%,var(--atm2),transparent 72%),
   radial-gradient(80% 50% at 50% 100%,var(--atm3),transparent 72%),
   linear-gradient(180deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  transition:--atm1 1.6s ease,--atm2 1.6s ease,--atm3 1.6s ease,--bg1 .5s,--bg2 .5s,--bg3 .5s}
#sky{position:fixed;left:0;top:0;width:100vw;height:100lvh;z-index:1;pointer-events:none;display:block}
.wrap{position:relative;z-index:2;max-width:720px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 14px)}
.glass{background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--gb);
  -webkit-backdrop-filter:blur(17px) saturate(130%);backdrop-filter:blur(17px) saturate(130%);box-shadow:var(--shadow);border-radius:20px}
.fade{animation:enter .55s cubic-bezier(.2,.7,.2,1) both}
.fade:nth-child(2){animation-delay:.04s}.fade:nth-child(3){animation-delay:.08s}.fade:nth-child(4){animation-delay:.12s}
.fade:nth-child(5){animation-delay:.16s}.fade:nth-child(6){animation-delay:.2s}.fade:nth-child(7){animation-delay:.24s}.fade:nth-child(8){animation-delay:.28s}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* header */
.top{text-shadow:var(--hshadow);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.place{display:flex;align-items:center;gap:5px;color:var(--accent);font:500 13px/1.2 var(--fm);min-width:0}
.place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place svg{flex:none}
h1{margin:3px 0 0;font:800 30px/1.05 var(--fh);letter-spacing:-.02em}
.rng{text-shadow:none;background:linear-gradient(90deg,#46c8e8,#3d8de0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.btns{display:flex;gap:8px;flex:none}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  background:linear-gradient(160deg,var(--g1),var(--g2));border:1px solid var(--gb);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--shadow);transition:transform .15s}
.iconbtn:active{transform:scale(.94)}
.iconbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid #46c8e8;outline-offset:2px}
/* now card */
.now{padding:16px 16px 14px;background:linear-gradient(150deg,var(--nowg1),var(--nowg2) 60%),linear-gradient(160deg,var(--g1),var(--g2));border-radius:22px}
.nowtop{display:flex;align-items:center;gap:12px}
.nowicon{width:84px;height:84px;flex:none}
.temp{font:800 54px/1 var(--fh);letter-spacing:-.03em}
.temp small{font-size:.5em;vertical-align:top;margin-left:2px;font-weight:700;color:var(--muted)}
.desc{font:600 15px/1.3 var(--fb);margin-top:3px}
.feels{color:var(--muted);font-size:13.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--chipb);font:500 12.5px/1.3 var(--fm);white-space:nowrap}
.chip svg{flex:none}
.chip.moon{white-space:normal;max-width:100%}
.status{display:flex;gap:9px;align-items:baseline;margin:13px 2px 0;font-size:14.5px}
.status .dot{width:8px;height:8px;border-radius:50%;background:#3d8de0;box-shadow:0 0 0 3px rgba(61,141,224,.22);flex:none;transform:translateY(-1px)}
.status b{color:var(--accent);white-space:nowrap}
.tips{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.tip{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:13px;border:1px solid rgba(240,160,80,.42);background:rgba(240,160,80,.08);font-size:13.5px;line-height:1.4}
.tip.serious{border-color:rgba(232,72,72,.62);background:rgba(232,72,72,.11)}
.tip .ti{font-size:17px;line-height:1.1;flex:none}
.tip b{font-weight:700;white-space:nowrap}
.err{margin:12px 2px 0;color:var(--muted);font-size:14px}
.err button{margin-top:8px}
.btn{border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font:600 13px var(--fb);color:#fff;background:linear-gradient(135deg,#2f6fe0,#3da9c9);box-shadow:0 0 14px rgba(61,169,201,.35)}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--chipb);box-shadow:none}
/* search */
.searchwrap{position:relative;margin-top:14px;z-index:20}
.searchwrap.open .favs{visibility:hidden}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;height:46px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:500 15px var(--fb);height:100%;outline:none}
.search input::placeholder{color:var(--muted);opacity:.85}
.search svg{flex:none;opacity:.8}
.sug{position:absolute;z-index:30;left:0;right:0;top:52px;max-height:min(360px,60vh);overflow:auto;margin:0;padding:6px;list-style:none;border-radius:16px;background:var(--pop);border:1px solid var(--gb);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sug[hidden]{display:none}
.sug li{padding:9px 11px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column}
.sug li[aria-selected="true"],.sug li:hover{background:rgba(61,141,224,.18)}
.sug li .n{font-weight:600}
.sug li .r{font-size:12.5px;color:var(--muted)}
.sug li.empty{color:var(--muted);cursor:default;background:none}
/* favs */
.favs{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;display:inline-flex;align-items:center;border-radius:999px;background:var(--chip);border:1px solid var(--chipb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden}
.fav.on{background:linear-gradient(135deg,#2f6fe0,#3da9c9);border-color:transparent;color:#fff;box-shadow:0 0 14px rgba(61,169,201,.4)}
.fav button{border:0;background:none;cursor:pointer;padding:7px 4px 7px 12px;font:500 13px var(--fb);white-space:nowrap}
.fav button.x{padding:7px 10px 7px 6px;opacity:.7;font-size:12px}
.fav button.x:hover{opacity:1}
.fav.solo button{padding:7px 12px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.tile{padding:11px 12px;border-radius:18px;min-width:0}
.tile .l{font:600 10.5px/1.2 var(--fb);letter-spacing:.07em;text-transform:uppercase}
.tile .v{font:500 19px/1.2 var(--fm);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:12px;color:var(--muted);margin-left:2px}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* panels */
.panel{margin-top:12px;padding:13px 13px 12px}
.ph{font:500 12px/1.3 var(--fm);color:var(--muted);margin:0 2px 9px}
.strip{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:1px}
.strip::-webkit-scrollbar{display:none}
.hr{flex:none;width:62px;scroll-snap-align:start;text-align:center;padding:7px 4px 8px;border-radius:14px;background:var(--chip);border:1px solid var(--chipb);display:flex;flex-direction:column;align-items:center;gap:1px}
.hr.first{border-color:#3dd6d0;box-shadow:0 0 0 1px rgba(61,214,208,.35) inset}
.hr .d{font:600 10.5px var(--fb);color:var(--accent);height:14px}
.hr .h{font:500 12.5px var(--fm)}
.hr .t{font:500 14px var(--fm)}
.hr .p{font:500 11px var(--fm);color:#38b8e8;height:15px}
.hr.day{width:70px}
.hr .mx{color:#e6a15a}.hr .mn{color:#5b8df0}
.hr .dt{font:400 11px var(--fm);color:var(--muted)}
/* toolbar */
.bar{display:flex;align-items:center;gap:8px;width:100%}
.seg{display:flex;padding:3px;gap:2px;border-radius:999px;background:var(--chip);border:1px solid var(--chipb)}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--muted);font:600 12.5px var(--fb);padding:7px 6px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#2f6fe0,#3da9c9);color:#fff;box-shadow:0 0 14px rgba(61,169,201,.42)}
.seg button svg{flex:none}
.seg.range{flex:3 1 0}
.seg.metric{flex:2 1 0}
.vsep{width:1px;align-self:stretch;margin:4px 0;background:var(--gb);flex:none}
@media (max-width:370.98px){.seg.metric .lbl{display:none}.seg.metric{flex:0 0 auto}.seg.metric button{padding:7px 12px}}
.sub{font:500 12px/1.35 var(--fm);color:var(--muted);margin:11px 2px 4px}
#chart{width:100%;height:260px;position:relative;touch-action:pan-y;cursor:crosshair}
#chart svg{display:block;overflow:visible}
#chart .ax{font:400 9.5px var(--fm);fill:var(--muted)}
#chart .axu{font:500 9px var(--fm);fill:var(--muted);letter-spacing:.05em}
#chart .bl{font:500 9.5px var(--fm);fill:var(--muted)}
#chart .vl{font:500 9.5px var(--fm)}
#chart .tl{font:600 10px var(--fm);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round}
#chart .ml{font:500 9.5px var(--fm);fill:var(--muted)}
.grow rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fin{animation:fin .7s .12s ease both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.detail{font:500 12.5px/1.4 var(--fm);margin:6px 2px 0;min-height:18px}
.detail.hint{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:5px 7px;margin:10px 0 0}
.lg{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--fm);color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--chipb)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg i.ln{height:3px;width:14px;border-radius:2px}
.lg i.dash{height:0;width:14px;border-top:2px dashed currentColor;border-radius:0;background:none!important}
/* map */
.mapbar{display:flex}
.mapbar .seg{flex:1}
.mapbox{margin-top:10px;border-radius:14px;overflow:hidden;height:380px;background:var(--chip)}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.mapnote{font:400 11px var(--fm);color:var(--muted);margin:7px 2px 0}
@media (max-width:420px){.mapbox{height:340px}.mapbar .seg button{font-size:11.5px;padding:7px 3px}}
/* footer */
footer{margin:18px 4px 0;font:400 11.5px/1.5 var(--fm);color:var(--muted)}
footer .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer .made{text-align:center;margin-top:8px}
footer .made b{color:var(--text);font-weight:500}
.ver{border:0;background:none;padding:0;cursor:pointer;color:var(--accent);font:inherit;text-decoration:underline dotted;text-underline-offset:3px}
/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 10px 10px 15px;border-radius:16px;background:var(--pop);border:1px solid var(--gb);box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;animation:enter .3s ease both}
.toast .btn{padding:7px 13px;flex:none}
/* modal */
.mback{position:fixed;inset:0;z-index:60;background:rgba(3,7,14,.55);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);animation:fin .2s ease both}
.modal{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--pop);border:1px solid var(--gb);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:18px 18px 16px;animation:enter .3s ease both}
.modal h2{font:800 22px var(--fh);margin:0;flex:1}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mclose{width:36px;height:36px;border-radius:50%;border:1px solid var(--chipb);background:var(--chip);cursor:pointer;font-size:15px}
.cl{margin:12px 0 0}
.cl h3{font:500 13px var(--fm);color:var(--accent);margin:0 0 4px}
.cl ul{margin:0;padding-left:19px}
.cl li{margin:2px 0;font-size:14px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skel{color:var(--muted);font-size:14px;padding:6px 2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gSun" cx="42%" cy="40%" r="62%"><stop offset="0" stop-color="#fff6c4"/><stop offset=".55" stop-color="#ffcf3d"/><stop offset="1" stop-color="#ff9f1c"/></radialGradient>
    <linearGradient id="gCloudL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d3e4"/></linearGradient>
    <linearGradient id="gCloudD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3aec0"/><stop offset="1" stop-color="#5e6a7c"/></linearGradient>
    <radialGradient id="gMoon" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#e2d7af"/></radialGradient>
    <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb31a"/></linearGradient>
  </defs>
</svg>
<div class="atmo" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="wrap">
  <header class="top fade">
    <div style="min-width:0">
      <div class="place"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="placeName">zjišťuji polohu…</span></div>
      <h1>Srážkoměr <span class="rng" id="rngLbl">48 h</span></h1>
    </div>
    <div class="btns">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Přepnout světlý nebo tmavý vzhled"></button>
      <button class="iconbtn" id="refreshBtn" type="button" aria-label="Obnovit data"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
  </header>

  <section class="now glass fade" id="nowCard" aria-live="polite"><div class="skel">Načítám předpověď…</div></section>

  <section class="searchwrap fade">
    <div class="search glass">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" class="vh">Hledat město</label>
      <input id="q" type="search" placeholder="Hledat město…" autocomplete="off" spellcheck="false" enterkeyhint="search"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug">
    </div>
    <ul class="sug" id="sug" role="listbox" aria-label="Nalezená místa" hidden></ul>

/* ================= data ================= */
const HOURLY = 'precipitation,precipitation_probability,temperature_2m,apparent_temperature,relativehumidity_2m,uv_index,windspeed_10m,windgusts_10m,winddirection_10m,weathercode,cloud_cover,is_day';
const DAILY = 'precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min,windspeed_10m_max,windgusts_10m_max,winddirection_10m_dominant,weathercode,sunrise,sunset';
const apiUrl = (lat, lon) => `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&hourly=${HOURLY}&daily=${DAILY}&forecast_days=14&past_days=1&timezone=auto`;

async function fetchJSON(url, ms=12000){
  const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), ms);
  try{ const r = await fetch(url, {signal:ac.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
function prepare(raw){
  const H = raw.hourly, Dd = raw.daily, off = (raw.utc_offset_seconds||0)*1000;
  const g = (o,k,i) => (o[k] && o[k][i] != null) ? o[k][i] : null;
  const hours = H.time.map((s,i)=>({
    t: parseLocal(s), p: g(H,'precipitation',i) ?? 0, pp: g(H,'precipitation_probability',i),
    temp: g(H,'temperature_2m',i) ?? 0, app: g(H,'apparent_temperature',i), rh: g(H,'relativehumidity_2m',i),
    uv: g(H,'uv_index',i), ws: kmh2ms(g(H,'windspeed_10m',i)) ?? 0, wg: kmh2ms(g(H,'windgusts_10m',i)) ?? 0,
    wd: g(H,'winddirection_10m',i), code: g(H,'weathercode',i) ?? 3, cc: g(H,'cloud_cover',i), day: g(H,'is_day',i)
  }));
  for(const h of hours){ if(h.wg < h.ws) h.wg = h.ws; }
  const days = Dd.time.map((s,i)=>({
    t: parseLocal(s), p: g(Dd,'precipitation_sum',i) ?? 0, pp: g(Dd,'precipitation_probability_max',i),
    tmax: g(Dd,'temperature_2m_max',i) ?? 0, tmin: g(Dd,'temperature_2m_min',i) ?? 0,
    ws: kmh2ms(g(Dd,'windspeed_10m_max',i)) ?? 0, wg: kmh2ms(g(Dd,'windgusts_10m_max',i)) ?? 0, wd: g(Dd,'winddirection_10m_dominant',i),
    code: g(Dd,'weathercode',i) ?? 3,
    rise: Dd.sunrise && Dd.sunrise[i] ? parseLocal(Dd.sunrise[i]) : null, set: Dd.sunset && Dd.sunset[i] ? parseLocal(Dd.sunset[i]) : null
  }));
  for(const d of days){ if(d.wg < d.ws) d.wg = d.ws; }
  return { off, hours, days };
}
const nowLocal = () => Date.now() + (S.data ? S.data.off : 0);
function buildView(){
  const D = S.data; if(!D) return null;
  const nowL = nowLocal();
  let i0 = D.hours.findIndex(h => h.t > nowL - 3600e3); if(i0 < 0) i0 = D.hours.length-1;
  const n = S.mode === '24h' ? 24 : 48;
  const hours = D.hours.slice(i0, i0 + n);
  let d0 = D.days.findIndex(d => dayNo(d.t) === dayNo(nowL)); if(d0 < 0) d0 = 0;
  const days = D.days.slice(d0, d0 + 14);
  const past = D.hours.filter(h => h.t > nowL - 24*3600e3 && h.t <= nowL);
  return { nowL, i0, hours, all: D.hours, days, today: D.days[d0], past24: sum(past.map(h=>h.p)), cur: D.hours[i0] };
}

async function load(opts={}){
  const place = S.place; if(!place) return;
  S.loading = true; $('#refreshBtn').classList.add('spin');
  const key = place.lat.toFixed(3)+','+place.lon.toFixed(3);
  try{
    const raw = await fetchJSON(apiUrl(place.lat, place.lon));
    if(place !== S.place) return;
    S.data = prepare(raw); S.offline = false; S.fetchedAt = Date.now(); S.error = null;
    store.set('cache', { key, t:S.fetchedAt, raw });
  }catch(e){
    if(place !== S.place) return;
    const c = store.get('cache', null);
    if(c && c.key === key && c.raw){ S.data = prepare(c.raw); S.offline = true; S.fetchedAt = c.t; S.error = null; }
    else if(!S.data || opts.placeChanged){ S.data = null; S.error = 'net'; }
    else S.offline = true;
  }finally{
    if(place === S.place){ S.loading = false; $('#refreshBtn').classList.remove('spin'); render(); }
  }
}

/* ================= poloha ================= */
function setPlace(p, save=true){
  S.place = { name:p.name, lat:+p.lat, lon:+p.lon };
  if(save) store.set('last', S.place);
  S.sel = null;
  $('#placeName').textContent = S.place.name;
  renderFavs(); updateMap();
  load({placeChanged:true});
}
async function reverseName(lat, lon){
  try{
    const j = await fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=cs`, 8000);
    return j.city || j.locality || j.principalSubdivision || null;
  }catch(e){ return null; }
}
const coordName = (lat, lon) => `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
function geolocate(userAction){
  return new Promise(resolve => {
    if(!('geolocation' in navigator)){ resolve(false); return; }
    let done = false;
    const fail = () => { if(done) return; done = true; resolve(false); };
    const guard = setTimeout(fail, 9000);
    navigator.geolocation.getCurrentPosition(async pos => {
      if(done) return; done = true; clearTimeout(guard);
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      setPlace({ name: coordName(lat, lon), lat, lon });
      const nm = await reverseName(lat, lon);
      if(nm && S.place && Math.abs(S.place.lat-lat)<1e-6){ S.place.name = nm; store.set('last', S.place); $('#placeName').textContent = nm; renderFavs(); }
      resolve(true);
    }, () => { clearTimeout(guard); fail(); }, { timeout:8000, enableHighAccuracy:false, maximumAge:300000 });
  });
}

/* ================= vykreslení ================= */
function render(){
  S.view = buildView();
  $('#rngLbl').textContent = S.mode==='24h' ? '24 h' : S.mode==='48h' ? '48 h' : '14 dní';
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode===S.mode)));
  document.querySelectorAll('[data-metric]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.metric===S.metric)));
  renderNow(); renderTiles(); renderStrip(); renderChart(); renderUpdated(); updateSky();
}

function renderNow(){
  const el = $('#nowCard'), V = S.view;
  if(!V){
    el.innerHTML = S.error ? `<div class="err">Předpověď se nepodařilo načíst. Zkontroluj připojení k internetu a zkus to znovu.<br><button class="btn" type="button" id="retryBtn">Zkusit znovu</button></div>`
                           : '<div class="skel">Načítám předpověď…</div>';
    const rb = $('#retryBtn'); if(rb) rb.onclick = () => load({placeChanged:true});
    return;
  }
  const c = V.cur, td = V.today, south = S.place.lat < 0, off = S.data.off;
  const nowUtc = Date.now();
  const ph = moonPhase(nowUtc), litR = ph.waxing !== south;
  const tFull = nextPhase(nowUtc, 180), tNew = nextPhase(nowUtc, 0);
  const nextEv = tFull < tNew ? 'úplněk '+dm(tFull+off) : 'nov '+dm(tNew+off);
  const moonSvg = `<svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true">${moonDisc(10,10,8.5,ph.frac,litR)}</svg>`;
  const chips = [];
  if(td && td.rise) chips.push(`<span class="chip" title="východ slunce">${ICON.rise}${hhmm(td.rise)}</span>`);
  if(td && td.set) chips.push(`<span class="chip" title="západ slunce">${ICON.set}${hhmm(td.set)}</span>`);
  if(c.rh!=null) chips.push(`<span class="chip" title="vlhkost">${ICON.drop}${Math.round(c.rh)}\u00a0%</span>`);
  if(c.uv!=null) chips.push(`<span class="chip" title="UV index">${ICON.uv}UV ${Math.round(c.uv)}</span>`);
  chips.push(`<span class="chip moon" title="Měsíc">${moonSvg}${phaseName(nowUtc)} ${Math.round(ph.frac*100)}\u00a0% · ${nextEv}</span>`);
  const tips = computeTips(V);
  el.innerHTML = `
    <div class="nowtop">
      <div class="nowicon">${wIcon(c.code, !!c.day, c.t - off + 1800e3, 84, '', south)}</div>
      <div style="min-width:0">
        <div class="temp">${Math.round(c.temp)===0?0:Math.round(c.temp)}<small>°C</small></div>
        <div class="desc">${esc(wmoText(c.code))} · vítr ${f1(c.ws)} m/s</div>
        <div class="feels">${c.app!=null?'pocitově '+fmtT(c.app)+' · ':''}dnes ${td?fmtT(td.tmin):'–'} / ${td?fmtT(td.tmax):'–'}</div>
      </div>
    </div>
    <div class="chips">${chips.join('')}</div>
    <p class="status"><span class="dot" aria-hidden="true"></span><span>${statusText(V)}</span></p>
    ${tips.length?`<div class="tips">${tips.map(t=>`<div class="tip${t.serious?' serious':''}"><span class="ti" aria-hidden="true">${t.icon}</span><span>${t.html}</span></div>`).join('')}</div>`:''}`;
}

function statusText(V){
  const nowL = V.nowL;
  if(S.metric === 'precip'){
    if(S.mode === '7d'){
      const i = V.days.findIndex(d => d.p >= 0.5);
      if(i < 0) return 'Příštích 14 dní se výraznější srážky nečekají. ☀️';
      const d = V.days[i];
      return `Nejbližší srážky <b>${dayWord(d.t, nowL)}</b> (${f1(d.p)} mm${d.pp!=null?', '+Math.round(d.pp)+'\u00a0%':''}).`;
    }
    const i = V.hours.findIndex(h => h.p >= 0.1);
    if(i < 0) return `Příštích ${V.hours.length} hodin se srážky nečekají. ☀️`;
    const h = V.hours[i];
    return `Nejbližší srážky <b>${whenTxt(h.t, nowL)}</b> (${f1(h.p)} mm${h.pp!=null?', '+Math.round(h.pp)+'\u00a0%':''}).`;
  }
  if(S.mode === '7d'){
    let bi = 0; V.days.forEach((d,i) => { if(d.wg > V.days[bi].wg) bi = i; });
    const d = V.days[bi];
    return `Nejsilnější nárazy <b>${dayWord(d.t, nowL)}</b> (${f1(d.wg)} m/s, ${windWord(d.wg)}).`;
  }
  let bi = 0; V.hours.forEach((h,i) => { if(h.wg > V.hours[bi].wg) bi = i; });
  const h = V.hours[bi];
  return `Nejsilnější náraz <b>${whenTxt(h.t, nowL)}</b> (${f1(h.wg)} m/s, ${windWord(h.wg)}).`;
}

    ()=>`Mlha jako mléko. Světla zapnout a jezdit s rezervou.`,
    ()=>`Ve hře je mlha. Viditelnost bude stát za houby.`,

};
function pickTip(type, ...args){
  const T = TIPS[type];
  if(!tipPick.has(type)) tipPick.set(type, Math.floor(Math.random()*T.t.length));
  return { type, pr:T.pr, icon:T.icon, serious:!!T.serious, html:T.t[tipPick.get(type) % T.t.length](...args) };
}
function computeTips(V){
  const nowL = V.nowL, all = V.all, i0 = V.i0;
  const win = all.slice(i0, i0+18), w48 = all.slice(i0, i0+48);
  const out = [];
  const short = t => (dayNo(t)===dayNo(nowL) ? 'v ' : dayWord(t, nowL)+' v ') + hhmm(t);
  const storm = win.find(h => h.code===95||h.code===96||h.code===99);
  if(storm) out.push(pickTip('storm', storm===win[0] ? 'už teď' : short(storm.t)));
  const gmax = Math.max(0, ...win.map(h=>h.wg));
  if(gmax >= 20) out.push(pickTip('gale', f1(gmax)));
  else if(gmax >= 14) out.push(pickTip('wind', f1(gmax)));
  if(w48.length && w48[0].p >= 0.2){
    let n = 0; while(n < w48.length && w48[n].p >= 0.2) n++;
    out.push(pickTip('rainNow', n >= w48.length ? n+'+' : n));
  }else{
    const soon = w48.slice(1,13).find(h => h.p >= 0.2 && (h.pp==null || h.pp >= 40));
    if(soon) out.push(pickTip('rainSoon', short(soon.t), soon.pp!=null?Math.round(soon.pp):'?'));
  }
  const uvmax = Math.max(0, ...win.map(h=>h.uv||0));
  if(uvmax >= 8) out.push(pickTip('uv8', Math.round(uvmax)));
  else if(uvmax >= 6) out.push(pickTip('uv6', Math.round(uvmax)));
  const tmax = Math.max(...win.map(h=>h.temp)), tmin = Math.min(...win.map(h=>h.temp));
  if(tmax >= 30) out.push(pickTip('heat', Math.round(tmax)));
  if(tmin <= 0) out.push(pickTip('frost', Math.round(tmin)===0?0:Math.round(tmin)));
  if(!storm && win.some(h => h.code===45||h.code===48)) out.push(pickTip('fog'));
  return out.sort((a,b)=>b.pr-a.pr).slice(0,3);
}

/* ---------- dlaždice ---------- */
function tile(label, color, value, sub){
  return `<div class="tile glass"><div class="l" style="color:${color}">${label}</div><div class="v">${value}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
}
function renderTiles(){
  const el = $('#tiles'), V = S.view;
  if(!V){ el.innerHTML = ''; return; }
  const nowL = V.nowL, C1='var(--c1)', C2='var(--c2)', C3='var(--c3)', C4='var(--c4)';
  let h = '';
  if(S.metric === 'precip'){
    if(S.mode === '7d'){
      const tot = sum(V.days.map(d=>d.p)); let bi = 0; V.days.forEach((d,i)=>{ if(d.p > V.days[bi].p) bi = i; });
      const wet = V.days[bi], gmax = Math.max(...V.days.map(d=>d.wg));
      h += tile('Úhrn 14 dní', C1, `${f1(tot)}<small>mm</small>`, `${V.days.filter(d=>d.p>=0.5).length} dní se srážkami`);
      h += wet.p >= 0.1 ? tile('Nejdeštivější', C2, `${f1(wet.p)}<small>mm</small>`, dayWord(wet.t, nowL)) : tile('Nejdeštivější', C2, '–', 'bez srážek');
      h += tile('Teplota období', C3, `${fmtT(Math.min(...V.days.map(d=>d.tmin)))} – ${fmtT(Math.max(...V.days.map(d=>d.tmax)))}`, 'min – max');
      h += tile('Max náraz větru', C4, `${f1(gmax)}<small>m/s</small>`, windWord(gmax));
    }else{
      const hs = V.hours, n = hs.length, tot = sum(hs.map(x=>x.p)), gmax = Math.max(...hs.map(x=>x.wg));
      const wetH = hs.filter(x=>x.p>=0.1).length;
      h += tile(`Úhrn ${n} h`, C1, `${f1(tot)}<small>mm</small>`, wetH ? `${wetH} h se srážkami` : 'bez srážek');
      h += tile('Spadlo za 24 h', C2, `${f1(V.past24)}<small>mm</small>`, 'uplynulých');
      h += tile('Teplota', C3, `${fmtT(Math.min(...hs.map(x=>x.temp)))} – ${fmtT(Math.max(...hs.map(x=>x.temp)))}`, `příštích ${n} h`);
      h += tile('Max náraz větru', C4, `${f1(gmax)}<small>m/s</small>`, windWord(gmax));
    }
  }else{
    if(S.mode === '7d'){
      const ds = V.days; let bi = 0, gi = 0; ds.forEach((d,i)=>{ if(d.ws > ds[bi].ws) bi = i; if(d.wg > ds[gi].wg) gi = i; });
      const dd = domDir(ds.map(d=>({s:d.ws, d:d.wd})));
      h += tile('Max vítr', C1, `${f1(ds[bi].ws)}<small>m/s</small>`, windWord(ds[bi].ws));
      h += tile('Max náraz', C4, `${f1(ds[gi].wg)}<small>m/s</small>`, dayWord(ds[gi].t, nowL));
      h += tile('Největrnější den', C2, dayWord(ds[bi].t, nowL), `${f1(ds[bi].ws)} m/s`);
      h += tile('Převažující směr', C3, dd==null?'–':dirName(dd), 'odkud fouká');
    }else{
      const hs = V.hours; let bi = 0, gi = 0; hs.forEach((x,i)=>{ if(x.ws > hs[bi].ws) bi = i; if(x.wg > hs[gi].wg) gi = i; });
      const avg = sum(hs.map(x=>x.ws))/hs.length, dd = domDir(hs.map(x=>({s:x.ws, d:x.wd})));
      h += tile('Max vítr', C1, `${f1(hs[bi].ws)}<small>m/s</small>`, windWord(hs[bi].ws));
      h += tile('Max náraz', C4, `${f1(hs[gi].wg)}<small>m/s</small>`, whenTxt(hs[gi].t, nowL));
      h += tile('Prům. vítr', C2, `${f1(avg)}<small>m/s</small>`, windWord(avg));
      h += tile('Převažující směr', C3, dd==null?'–':dirName(dd), 'odkud fouká');
    }
  }
  el.innerHTML = h;
}

/* ---------- pásek dlaždic ---------- */
function renderStrip(){
  const el = $('#strip'), V = S.view, lbl = $('#stripLbl');
  const modeKey = S.mode;
  const keep = S.lastModeKey === modeKey ? el.scrollLeft : 0;
  if(!V){ el.innerHTML = ''; lbl.textContent = 'výhled'; return; }
  const off = S.data.off, south = S.place.lat < 0;
  let h = '';
  if(S.mode === '7d'){
    lbl.textContent = 'výhled po dnech · 14 dní · max / min';
    V.days.forEach((d,i)=>{
      h += `<div class="hr day${i===0?' first':''}"><div class="d">${dayShort(d.t, V.nowL)}</div><div class="dt">${dm(d.t)}</div>${wIcon(d.code, true, d.t-off+12*3600e3, 34, '', south)}<div class="t"><span class="mx">${fmtT(d.tmax)}</span> <span class="mn">${fmtT(d.tmin)}</span></div><div class="p">${d.p>=0.1?f1(d.p)+' mm':''}</div></div>`;
    });
  }else{
    lbl.textContent = `výhled po hodinách · dalších ${V.hours.length} h`;
    let prevDay = null;
    V.hours.forEach((x,i)=>{
      const dn = dayNo(x.t); const showDay = i===0 || dn !== prevDay; prevDay = dn;
      h += `<div class="hr${i===0?' first':''}"><div class="d">${showDay?dayShort(x.t, V.nowL):''}</div><div class="h">${hhmm(x.t)}</div>${wIcon(x.code, !!x.day, x.t-off+1800e3, 34, '', south)}<div class="t">${fmtT(x.temp)}</div><div class="p">${x.p>=0.1?f1(x.p):''}</div></div>`;
    });
  }
  el.innerHTML = h;
  el.scrollLeft = keep;
  S.lastModeKey = modeKey;
}

/* ---------- graf ---------- */
function chartPal(){
  const dark = S.theme === 'dark';
  return {

function niceMax(m){ if(m<=10) return 10; if(m<=20) return Math.ceil(m/2)*2; if(m<=40) return Math.ceil(m/4)*4; if(m<=100) return Math.ceil(m/10)*10; return Math.ceil(m/20)*20; }

const n1 = v => v.toFixed(1);

function extremes(vals, minGap=4, minDiff=0.8){
  const n = vals.length; if(!n) return [];
  const mx = Math.max(...vals), mn = Math.min(...vals);

  const c = [];
  for(let i=1;i<n-1;i++){
    const w = vals.slice(Math.max(0,i-3), i+4);
    const isMax = vals[i] === Math.max(...w), isMin = vals[i] === Math.min(...w);
    if(!isMax && !isMin) continue;

    const prom = isMax ? Math.min(vals[i]-Math.min(...L), vals[i]-Math.min(...R)) : Math.min(Math.max(...L)-vals[i], Math.max(...R)-vals[i]);

  c.sort((a,b)=>b[2]-a[2]);

function arrowG(x, y, deg, color, sz=6){

function hourLabels(G, hs, withIcons, P){

function svgHourlyPrecip(G, hs, P){

  }

function svgHourlyWind(G, hs, P){

function svgDailyPrecip(G, ds, P){

  ds.forEach((d,i)=>{ if(d.p <= 0) return; const hh = Math.max(1.4, G.y0 - yP(d.p));
    s += `<rect x="${n1(G.cx(i)-bw/2)}" y="${n1(G.y0-hh)}" width="${n1(bw)}" height="${n1(hh)}" rx="2" fill="${dailyColor(d.p)}"${i>=10?' opacity=".4"':''} style="animation-delay:${i*25}ms"/>`; });

  const cut = Math.min(9, ds.length-1);

    const op = i>=10 ? ' opacity=".4"' : '';
    s += `<g${op}><circle cx="${n1(mx[i][0])}" cy="${n1(mx[i][1])}" r="2.7" fill="${P.tmax}"/><circle cx="${n1(mn[i][0])}" cy="${n1(mn[i][1])}" r="2.7" fill="${P.tmin}"/>`+
      `<text class="tl" x="${n1(mx[i][0])}" y="${n1(mx[i][1]-6)}" text-anchor="middle" style="fill:${P.tmax};font-size:${fs}px">${fmtT(d.tmax)}</text>`+
      `<text class="tl" x="${n1(mn[i][0])}" y="${n1(mn[i][1]+13)}" text-anchor="middle" style="fill:${P.tmin};font-size:${fs}px">${fmtT(d.tmin)}</text></g>`;
  });

function svgDailyWind(G, ds, P){

(function(){
  const q = $('#q'), list = $('#sug');
  let timer = 0, items = [], active = -1, reqId = 0;
  const wrapEl = q.closest('.searchwrap');
  const close = () => { list.hidden = true; wrapEl.classList.remove('open'); q.setAttribute('aria-expanded','false'); q.removeAttribute('aria-activedescendant'); active = -1; };
  const paint = () => {
    if(!items.length){ list.innerHTML = '<li class="empty" role="option" aria-disabled="true">Nic jsem nenašel.</li>'; }
    else list.innerHTML = items.map((it,i)=>`<li role="option" id="opt${i}" data-i="${i}" aria-selected="${i===active}"><span class="n">${esc(it.name)}</span><span class="r">${esc([it.admin1, it.country].filter(Boolean).join(', '))}</span></li>`).join('');
    list.hidden = false; wrapEl.classList.add('open'); q.setAttribute('aria-expanded','true');
    if(active >= 0) q.setAttribute('aria-activedescendant','opt'+active); else q.removeAttribute('aria-activedescendant');
  };
  const choose = i => { const it = items[i]; if(!it) return; close(); q.value = ''; q.blur(); setPlace({ name:it.name, lat:it.latitude, lon:it.longitude }); };
  q.addEventListener('input', () => {
    clearTimeout(timer); const v = q.value.trim();
    if(v.length < 2){ close(); return; }
    timer = setTimeout(async () => {
      const id = ++reqId;
      try{
        const j = await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=cs&format=json`, 8000);
        if(id !== reqId) return;
        items = (j.results || []).slice(0,6); active = items.length ? 0 : -1; paint();
      }catch(e){ if(id === reqId){ items = []; list.innerHTML = '<li class="empty" role="option" aria-disabled="true">Hledání teď nefunguje.</li>'; list.hidden = false; wrapEl.classList.add('open'); q.setAttribute('aria-expanded','true'); } }
    }, 300);
  });
  q.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if(list.hidden || !items.length) return; e.preventDefault();
      active = (active + (e.key==='ArrowDown'?1:-1) + items.length) % items.length; paint();
      const el = document.getElementById('opt'+active); if(el) el.scrollIntoView({block:'nearest'});
    }else if(e.key === 'Enter'){ if(!list.hidden && items.length){ e.preventDefault(); choose(active < 0 ? 0 : active); } }
    else if(e.key === 'Escape'){ if(!list.hidden){ e.preventDefault(); close(); } else q.value = ''; }
  });
  list.addEventListener('mousedown', e => e.preventDefault());
  list.addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if(li) choose(+li.dataset.i); });
  document.addEventListener('pointerdown', e => { if(!e.target.closest('.searchwrap')) close(); });
})();

  const h = Math.floor(m/60); if(h < 24) return `před ${h} h`;

}

  const t = document.createElement('div'); t.className = 'toast'; if(id) t.dataset.id = id;

const spriteCache = new Map();
function cloudPal(kind, day, dark){
  let top, bot;
  switch(kind){
    case 'clear': case 'partly': top='#ffffff'; bot='#c2cfe1'; break;
    case 'cloudy': top='#e2e7ef'; bot='#97a3b5'; break;
    case 'fog': top='#e0e4ea'; bot='#aeb6c1'; break;
    case 'snow': top='#eff3f8'; bot='#b1bccb'; break;
    case 'storm': top='#8e97a8'; bot='#434a59'; break;
    default: top='#b8c1ce'; bot='#6b7586';
  }
  if(!day){ const f = dark ? .36 : .6; top = mixHex('#141c33', top, f); bot = mixHex('#0b1122', bot, f); }
  else if(dark){ top = mixHex('#2a3550', top, .9); bot = mixHex('#1a2238', bot, .82); }
  return { top, bot };
}
function makeCloudSprite(type, pal, seed){
  const key = type+'|'+pal.top+pal.bot+'|'+seed;
  if(spriteCache.has(key)) return spriteCache.get(key);
  const rnd = mulberry32(seed*7919+13);
  const w = type==='cu' ? 200 : 260, h = type==='cu' ? 130 : 80, pad = 24;
  const c = document.createElement('canvas'); c.width = w + 2*pad; c.height = h + 2*pad;
  const g = c.getContext('2d'); g.translate(pad, pad);
  const base = h*0.8, puffs = [];
  const j = k => (rnd()-.5)*k;
  if(type === 'cu'){
    const tall = 0.85 + rnd()*0.3;
    puffs.push([w*(0.5+j(.08)), base - h*0.40*tall, h*(0.27+rnd()*0.05)]);
    puffs.push([w*(0.33+j(.06)), base - h*0.27*tall, h*(0.20+rnd()*0.04)]);
    puffs.push([w*(0.67+j(.06)), base - h*0.29*tall, h*(0.21+rnd()*0.05)]);
    puffs.push([w*(0.19+j(.04)), base - h*0.13, h*(0.13+rnd()*0.03)]);
    puffs.push([w*(0.81+j(.04)), base - h*0.14, h*(0.14+rnd()*0.03)]);
    if(rnd() < .7) puffs.push([w*(0.42+j(.08)), base - h*0.52*tall, h*(0.15+rnd()*0.04)]);
    if(rnd() < .5) puffs.push([w*(0.6+j(.08)), base - h*0.48*tall, h*(0.13+rnd()*0.04)]);
  }else{
    const n = 7 + Math.floor(rnd()*4); let x = w*0.1;
    for(let i=0;i<n;i++){
      const r = h*(0.15 + rnd()*0.2);
      puffs.push([x, base - r*(0.3 + rnd()*0.45), r]);
      x += w*0.8/(n-1) * (0.6 + rnd()*0.8); if(x > w*0.9) x = w*0.9;
    }
  }
  const x0 = Math.min(...puffs.map(p=>p[0]-p[2]*.6)), x1 = Math.max(...puffs.map(p=>p[0]+p[2]*.6));
  const shape = () => { g.beginPath(); for(const [x,y,r] of puffs){ g.moveTo(x+r,y); g.arc(x,y,r,0,Math.PI*2); }
    const bh = h*(type==='cu'?0.12:0.16); g.moveTo(x0+bh,base); g.arc(x0+bh, base-bh, bh, Math.PI/2, Math.PI*1.5); g.lineTo(x1-bh, base-bh*2); g.arc(x1-bh, base-bh, bh, -Math.PI/2, Math.PI/2); g.closePath(); };
  const grad = g.createLinearGradient(0, base - h*0.7, 0, base);
  grad.addColorStop(0, pal.top); grad.addColorStop(1, pal.bot);
  g.fillStyle = grad; shape(); g.fill('nonzero');
  g.globalCompositeOperation = 'source-atop';
  const hl = g.createRadialGradient(w*0.3, h*0.1, 2, w*0.3, h*0.1, w*0.55);
  hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hl; g.fillRect(-pad,-pad,w+2*pad,h+2*pad);
  for(const [x,y,r] of puffs){
    const sh = g.createRadialGradient(x+r*.35, y+r*.75, r*.1, x+r*.35, y+r*.75, r*.95);
    sh.addColorStop(0,'rgba(20,30,50,.20)'); sh.addColorStop(1,'rgba(20,30,50,0)');
    g.fillStyle = sh; g.fillRect(x-r*1.4, y-r*1.4, r*2.8, r*2.8);
  }
  const bs = g.createLinearGradient(0, base-h*0.22, 0, base);
  bs.addColorStop(0,'rgba(20,30,50,0)'); bs.addColorStop(1,'rgba(20,30,50,.18)');
  g.fillStyle = bs; g.fillRect(-pad,-pad,w+2*pad,h+2*pad);
  // změkčení okraje: rozmazání (kde prohlížeč umí filtr), jinak zmenšit a při kreslení zvětšit
  const s = document.createElement('canvas'), sg = s.getContext('2d');
  sg.filter = 'blur(3px)';
  if(sg.filter === 'blur(3px)'){ s.width = c.width; s.height = c.height; sg.filter = 'blur(3px)'; sg.drawImage(c, 0, 0); }
  else { s.width = Math.round(c.width/2.5); s.height = Math.round(c.height/2.5); sg.imageSmoothingQuality = 'high'; sg.drawImage(c, 0, 0, s.width, s.height); }
  const out = { img:s, w: w + 2*pad, h: h + 2*pad };
  spriteCache.set(key, out);
  if(spriteCache.size > 80) spriteCache.delete(spriteCache.keys().next().value);
  return out;
}
const wrap180 = d => ((d % 360) + 540) % 360 - 180;
class Scene{
  constructor(p, W, H){ Object.assign(this, p); this.t = 0; this.flash = 0; this.nextFlash = 2 + Math.random()*4; this.double = 0; this.bolt = null; this.meteor = null; this.nextMeteor = 6 + Math.random()*12; this.build(W, H); }
  build(W, H){
    this.W = W; this.H = H;
    const rnd = mulberry32(Math.floor(Math.random()*1e9));
    this.az0 = this.lat >= 0 ? 180 : 0;
    // složka větru k východu (m/s); na obrazovce jako na mapě: východ vpravo, západ vlevo
    const toward = (this.wd + 180) % 360;
    this.u = this.ws * Math.sin(toward*RAD);
    let vx = this.u * 3.2; if(Math.abs(vx) < 2.5) vx = 2.5*(this.u >= 0 ? 1 : -1);
    this.cloudVx = vx;
    // sklon padání = vodorovný vítr / pádová rychlost (déšť ~7 m/s, mrholení ~2.5, sníh ~1.2, kroupy ~15)
    const fall = { drizzle:2.5, rain:7, showers:7, storm:8 }[this.kind] || 7;
    const MAXT = Math.tan(62*RAD);
    this.tanR = clamp(this.u/fall, -MAXT, MAXT);
    this.tanS = clamp(this.u/1.2, -2.2, 2.2);
    this.tanH = clamp(this.u/15, -MAXT, MAXT);
    const sizeK = clamp(W/430, .85, 1.7);
    // mraky
    this.clouds = [];
    const nMax = Math.round(11 * clamp(W/430, 1, 2.2));
    const nC = this.code === 0 ? 0 : Math.max(1, Math.round(clamp(this.cc,0,100)/100 * nMax));
    const heavy = ['cloudy','drizzle','rain','showers','snow','storm','fog'].includes(this.kind) || this.cc > 75;
    const pal = cloudPal(this.kind, this.day, this.dark);
    for(let i=0;i<nC;i++){
      const layer = i < nC*0.35 ? 0 : i < nC*0.7 ? 1 : 2;
      const type = heavy && rnd() < 0.6 ? 'st' : 'cu';
      const sp = makeCloudSprite(type, pal, 1 + Math.floor(rnd()*6));
      const sc = [0.5, 0.75, 1.05][layer] * (0.8 + rnd()*0.4) * sizeK;
      const w = sp.w*1.6*sc, h = sp.h*1.6*sc;
      this.clouds.push({ sp, w, h, layer, x: -w + rnd()*(W + w*1.5), y: H*(layer===0 ? -0.02 + rnd()*0.2 : layer===1 ? 0.02 + rnd()*0.3 : 0.08 + rnd()*0.38) - h*0.5,
        a: [0.55, 0.75, 0.94][layer], sp2: [0.4, 0.7, 1][layer]*(0.85 + rnd()*0.3), ph: rnd()*6.28, bob: 2 + rnd()*3, per: 6 + rnd()*5 });
    }
    this.clouds.sort((a,b)=>a.layer-b.layer);
    this.overcast = this.cc >= 85;
    this.topColor = pal.bot;
    // hvězdy

  render();
  const last = store.get('last', null);
  if(last && typeof last.lat === 'number' && typeof last.lon === 'number') setPlace(last, false);
  else geolocate(false).then(ok => { if(!ok) setPlace(DEFAULT_PLACE); });
  setInterval(() => { if(!document.hidden && S.place) load(); }, 10*60e3);
  setInterval(() => { renderUpdated(); }, 30e3);
  setInterval(() => { if(S.view && !document.hidden){ const v = buildView(); if(v && v.i0 !== S.view.i0) render(); } }, 60e3);
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ hiddenAt = Date.now(); return; }
    if(hiddenAt && Date.now() - hiddenAt > 30e3){ checkUpdate('resume'); if(Date.now() - S.fetchedAt > 10*60e3) load(); else render(); }
  });
  whatsNew();
  setTimeout(() => checkUpdate('start'), 4000);
  setInterval(() => checkUpdate('periodic'), 30*60e3);
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' }).catch(()=>{});
  }
}
init();
</script>
